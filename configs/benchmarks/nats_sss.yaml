evaluate:
  benchmark: nats_sss
  benchmark_version: "1.0"
  dataset: cifar10-valid
  target_split: valid
  target_metric: accuracy
  target_direction: maximize
  epoch_budget: 90
  metric_seed_reduction: mean
  catalog: ~/.config/zcp-test/data.json
provenance:
  benchmark_id: nats_sss
  search_space_id: nats_size
  api_type: sss
  source_page: https://github.com/D-X-Y/NATS-Bench
  download_url: https://drive.usercontent.google.com/download?id=1scOMTUwcQhAMa_IMedp9lTzwmgqHLGgA&export=download&confirm=t
  bootstrap: zcp-test data bootstrap --root /path/to/data --benchmarks nats_sss --yes
