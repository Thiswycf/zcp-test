evaluate:
  benchmark: nasbench201
  benchmark_version: "1.1"
  dataset: cifar10-valid
  target_split: valid
  target_metric: accuracy
  target_direction: maximize
  epoch_budget: 200
  metric_seed_reduction: mean
  catalog: ~/.config/zcp-test/data.json
provenance:
  benchmark_id: nasbench201
  search_space_id: nb201_topology
  source_page: https://github.com/D-X-Y/NAS-Bench-201
  download_url: https://drive.usercontent.google.com/download?id=16Y0UwGisiouVRxW-W5hEtbxmcHw_0hF_&export=download&confirm=t
  bootstrap: zcp-test data bootstrap --root /path/to/data --benchmarks nasbench201 --yes
