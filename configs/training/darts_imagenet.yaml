space: darts
dataset: imagenet1k
input_size: 224
model_profile: imagenet
init_channels: 48
layers: 14
auxiliary: true
auxiliary_weight: 0.4
drop_path_prob: 0.0
epochs: 250
optimizer: sgd
learning_rate: 0.5
momentum: 0.9
nesterov: true
weight_decay: 0.00003
scheduler: cosine
warmup_epochs: 0
batch_size: 128
grad_clip: 5.0
label_smoothing: 0.1
amp: true
amp_initial_scale: 128.0
protocol: darts-official-imagenet-evaluation
