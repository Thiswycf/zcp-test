<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="代理忠实度审计进度看板">
  <title>代理忠实度审计</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <div class="refresh-bar" aria-label="刷新控制">
      <button id="refresh-data" class="button primary" type="button">立即刷新</button>
      <button id="auto-refresh-toggle" class="button" type="button" aria-pressed="true">自动刷新：开</button>
      <label class="interval-control" for="refresh-interval">
        <span>间隔</span>
        <select id="refresh-interval">
          <option value="5">5 秒</option>
          <option value="15">15 秒</option>
          <option value="30" selected>30 秒</option>
          <option value="60">1 分钟</option>
        </select>
      </label>
      <span id="refresh-status" class="refresh-status" role="status" aria-live="polite">自动刷新已开启</span>
    </div>

    <article class="audit-card" aria-labelledby="audit-title">
      <header class="card-header">
        <h1 id="audit-title">代理忠实度审计</h1>
      </header>

      <div class="progress-block">
        <strong id="audit-percentage" class="percentage">--%</strong>
        <div id="audit-progress" class="progress-track" role="progressbar" aria-label="审计进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="audit-progress-bar"></span>
        </div>
      </div>

      <dl class="audit-details">
        <div>
          <dt>当前阶段</dt>
          <dd id="audit-phase">载入中</dd>
        </div>
        <div>
          <dt>结论</dt>
          <dd id="audit-conclusion">正在读取审计状态。</dd>
        </div>
        <div>
          <dt>预计完成（北京时间）</dt>
          <dd id="audit-eta">--</dd>
        </div>
      </dl>
    </article>
  </main>
</body>
</html>
